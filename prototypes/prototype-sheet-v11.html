<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pervan Product Spec Sheet - V11 Compact Half-Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" />
<style>
  :root {
    --pv-bg-sheet: #FAF9F6;
    --pv-surface-card: #FFFFFF;
    --pv-surface-track: #ECEAE4;
    --pv-border-hairline: rgba(18, 18, 20, 0.08);
    
    --pv-text-primary: #121214;
    --pv-text-secondary: #52525B;
    --pv-text-tertiary: #8E8E93;
    
    --pv-terracotta: #C8461E;
    --pv-green-live: #10B981;
    
    --pv-radius-sheet: 24px;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #09090B;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-feature-settings: "tnum" 1, "cv02" 1;
  }

  /* Backdrop with Catalog List Visible in Background */
  .pv-ux-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
  }

  /* Compact 340px Half-Sheet */
  .pv-half-sheet {
    width: 100%;
    max-width: 440px;
    background: var(--pv-bg-sheet);
    border-radius: var(--pv-radius-sheet) var(--pv-radius-sheet) 0 0;
    border-top: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 -20px 48px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    padding: 0 0 calc(12px + env(safe-area-inset-bottom, 0px));
  }

  /* 0. Drag Handle */
  .pv-handle-zone {
    padding: 8px 0 4px;
    display: flex;
    justify-content: center;
    cursor: grab;
    flex-shrink: 0;
  }
  .pv-handle {
    width: 36px;
    height: 3.5px;
    background: rgba(18, 18, 20, 0.18);
    border-radius: 999px;
  }

  /* 1. Horizontal Compact Header (64px Image + Details) */
  .pv-compact-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 18px 12px;
    gap: 14px;
  }
  .pv-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .pv-thumb-box {
    width: 60px;
    height: 60px;
    background: #FFFFFF;
    border: 1px solid var(--pv-border-hairline);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }
  .pv-thumb-img {
    width: 44px;
    height: auto;
    object-fit: contain;
  }
  .pv-header-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .pv-brand-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--pv-text-tertiary);
  }
  .pv-product-name {
    font-size: 15.5px;
    line-height: 20px;
    font-weight: 800;
    color: var(--pv-text-primary);
    letter-spacing: -0.02em;
  }
  .pv-trust-line {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    line-height: 14px;
    font-weight: 600;
    color: #065F46;
  }
  .pv-live-dot {
    width: 5.5px;
    height: 5.5px;
    background: var(--pv-green-live);
    border-radius: 50%;
    box-shadow: 0 0 0 2.5px rgba(16, 185, 129, 0.2);
  }

  .pv-close-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(18, 18, 20, 0.05);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--pv-text-secondary);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* 2. Interactive Packaging & Coverage Zone */
  .pv-interactive-body {
    padding: 0 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pv-section-label-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 2px;
  }
  .pv-section-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--pv-text-tertiary);
  }
  .pv-section-spec {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--pv-text-secondary);
  }

  /* Unified Segmented Selector (Volume + Metric) */
  .pv-segmented-selector {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--pv-surface-track);
    padding: 4px;
    border-radius: 12px;
  }
  .pv-seg-btn {
    border: none;
    background: transparent;
    padding: 9px 0 8px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .pv-seg-vol {
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 16px;
    font-weight: 800;
    color: var(--pv-text-secondary);
  }
  .pv-seg-area {
    font-size: 10.5px;
    line-height: 13px;
    font-weight: 600;
    color: var(--pv-text-tertiary);
  }
  /* Active Button */
  .pv-seg-btn.active {
    background: #121214;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16);
  }
  .pv-seg-btn.active .pv-seg-vol {
    color: #FFFFFF;
  }
  .pv-seg-btn.active .pv-seg-area {
    color: #D4D4D8;
  }

  /* 3. Quiet Editorial Color Note */
  .pv-color-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 4px 0;
    font-size: 11.5px;
    line-height: 15px;
    color: var(--pv-text-secondary);
  }
  .pv-color-pill {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--pv-text-primary);
    background: rgba(18, 18, 20, 0.06);
    padding: 2px 5px;
    border-radius: 4px;
  }

  /* 4. Action CTA Dock */
  .pv-dock-zone {
    padding: 4px 18px 0;
  }
  .pv-cta-primary {
    width: 100%;
    height: 48px;
    background: var(--pv-terracotta);
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 13.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(200, 70, 30, 0.28);
    letter-spacing: -0.01em;
  }
  .pv-cta-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pv-cta-arrow {
    font-size: 16px;
    font-weight: 800;
  }
</style>
</head>
<body>

<div class="pv-ux-backdrop">
  <div class="pv-half-sheet">
    
    <!-- Drag Handle -->
    <div class="pv-handle-zone">
      <div class="pv-handle"></div>
    </div>

    <!-- 1. Horizontal Compact Header -->
    <div class="pv-compact-header">
      <div class="pv-header-left">
        <div class="pv-thumb-box">
          <img class="pv-thumb-img" src="assets/filli-official/momento-silan.png" alt="Momento Silan" />
        </div>
        <div class="pv-header-meta">
          <span class="pv-brand-eyebrow">FİLLİ BOYA &middot; İÇ CEPHE</span>
          <h2 class="pv-product-name">Momento Silan İpeksi Mat</h2>
          <div class="pv-trust-line">
            <div class="pv-live-dot"></div>
            <span>Stokta Hazır &middot; Aynı Gün Teslimat</span>
          </div>
        </div>
      </div>
      <button type="button" class="pv-close-btn" aria-label="Kapat">&times;</button>
    </div>

    <!-- 2. Interactive Packaging & Coverage Zone -->
    <div class="pv-interactive-body">
      
      <div class="pv-section-label-row">
        <span class="pv-section-label">AMBALAJ &amp; SARFİYAT</span>
        <span class="pv-section-spec" id="pvSpecMeta">15 L // ~20.5 KG // İpeksi Mat</span>
      </div>

      <div class="pv-segmented-selector">
        <button type="button" class="pv-seg-btn" onclick="selectPkg('2.5 L', '~19 m²', '2.5 L // ~3.5 KG // İpeksi Mat')">
          <span class="pv-seg-vol">2.5 L</span>
          <span class="pv-seg-area">~19 m² Alan</span>
        </button>
        <button type="button" class="pv-seg-btn" onclick="selectPkg('7.5 L', '~56 m²', '7.5 L // ~10.5 KG // İpeksi Mat')">
          <span class="pv-seg-vol">7.5 L</span>
          <span class="pv-seg-area">~56 m² Alan</span>
        </button>
        <button type="button" class="pv-seg-btn active" onclick="selectPkg('15 L', '~113 m²', '15 L // ~20.5 KG // İpeksi Mat')">
          <span class="pv-seg-vol">15 L</span>
          <span class="pv-seg-area">~113 m² Alan</span>
        </button>
      </div>

      <!-- Quiet Editorial Color Line -->
      <div class="pv-color-hint">
        <span class="pv-color-pill">RENK</span>
        <span>İstediğiniz Filli Boya, RAL veya NCS kodunu WhatsApp'ta iletin.</span>
      </div>

    </div>

    <!-- 3. Direct Action CTA Dock -->
    <div class="pv-dock-zone">
      <a href="https://wa.me/905323844497?text=Merhaba,%20Momento%20Silan%20(15L)%20sipari%C5%9Fi%20vermek%20istiyorum." target="_blank" class="pv-cta-primary" id="pvCtaBtn">
        <div class="pv-cta-left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.699c.971.53 1.771.815 2.796.815 3.181 0 5.767-2.587 5.768-5.767 0-3.18-2.587-5.767-5.768-5.767zm0 10.364c-.886 0-1.579-.247-2.427-.751l-.173-.103-1.803.473.481-1.758-.113-.181c-.563-.898-.86-1.583-.86-2.279 0-2.536 2.064-4.6 4.6-4.6 2.535 0 4.599 2.064 4.599 4.6 0 2.536-2.064 4.6-4.599 4.6z"/>
          </svg>
          <span id="pvCtaText">WhatsApp ile Sipariş Ver (15 L)</span>
        </div>
        <span class="pv-cta-arrow">&rarr;</span>
      </a>
    </div>

  </div>
</div>

<script>
function selectPkg(vol, area, meta) {
  document.querySelectorAll('.pv-seg-btn').forEach(btn => {
    btn.classList.toggle('active', btn.querySelector('.pv-seg-vol').innerText === vol);
  });
  document.getElementById('pvSpecMeta').innerText = meta;
  document.getElementById('pvCtaText').innerText = 'WhatsApp ile Sipariş Ver (' + vol + ')';
  document.getElementById('pvCtaBtn').href = 'https://wa.me/905323844497?text=Merhaba,%20Momento%20Silan%20(' + encodeURIComponent(vol) + ')%20sipari%C5%9Fi%20vermek%20istiyorum.';
}
</script>

</body>
</html>
