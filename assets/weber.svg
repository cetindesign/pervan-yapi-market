<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%">
  <!-- Yellow-Black Weber Hexagon Emblem -->
  <g transform="translate(10, 16)">
    <!-- Yellow polygon background -->
    <polygon points="0,28 14,0 42,0 56,28 42,56 14,56" fill="#FEE000"/>
    <!-- Black overlay wing -->
    <polygon points="28,0 42,0 56,28 42,56 28,56 42,28" fill="#111111"/>
    <!-- White inner accent -->
    <polygon points="14,28 21,14 35,14 28,28 35,42 21,42" fill="#FFFFFF"/>
  </g>

  <!-- WEBER Official Typography -->
  <text x="78" y="50" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.045em" fill="#111111">weber</text>

  <!-- SAINT-GOBAIN Lockup -->
  <text x="80" y="68" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.2em" fill="#555555">SAINT-GOBAIN</text>
</svg>