<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 105" width="100%" height="100%">
  <!-- Centered Authentic Weber Lockup -->
  <g transform="translate(18, 12)">
    <!-- Yellow-Black Weber Hexagon Emblem (Large, bold, authentic) -->
    <g transform="translate(0, 4) scale(1.45)">
      <!-- Yellow background polygon -->
      <polygon points="0,28 14,0 42,0 56,28 42,56 14,56" fill="#FEE000"/>
      <!-- Jet black shadow wing -->
      <polygon points="28,0 42,0 56,28 42,56 28,56 42,28" fill="#111111"/>
      <!-- Crisp white inner accent -->
      <polygon points="14,28 21,14 35,14 28,28 35,42 21,42" fill="#FFFFFF"/>
    </g>

    <!-- weber Heavy Geometric Wordmark -->
    <text x="104" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-0.045em" fill="#111111">weber</text>

    <!-- SAINT-GOBAIN Official Endorsement -->
    <text x="106" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="0.28em" fill="#444444">SAINT-GOBAIN</text>
  </g>
</svg>