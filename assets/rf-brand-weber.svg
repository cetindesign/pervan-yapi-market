<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="1200" fill="#F8F8F7"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>

  <!-- Top Category Tag -->
  <text x="450" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0.22em" fill="#888888" text-anchor="middle">YETKİLİ DAĞITICI BAYİ</text>

  <!-- Saint-Gobain Bridge & Weber Hexagon Emblem Group -->
  <g transform="translate(450, 480)">
    <!-- Saint-Gobain Colorful Arc Bridge Motif -->
    <path d="M -110,-60 C -60,-115 60,-115 110,-60 C 90,-45 -90,-45 -110,-60 Z" fill="#0072CE"/>
    <path d="M -95,-60 C -50,-105 50,-105 95,-60 C 80,-48 -80,-48 -95,-60 Z" fill="#00A3E0"/>
    <path d="M -80,-60 C -40,-95 40,-95 80,-60 C 65,-50 -65,-50 -80,-60 Z" fill="#43B02A"/>
    <path d="M -65,-60 C -30,-85 30,-85 65,-60 C 50,-52 -50,-52 -65,-60 Z" fill="#FFB81C"/>
    <path d="M -50,-60 C -20,-75 20,-75 50,-60 C 40,-54 -40,-54 -50,-60 Z" fill="#E05A47"/>

    <!-- SAINT-GOBAIN Text -->
    <text x="0" y="-15" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="0.28em" fill="#333333" text-anchor="middle">SAINT-GOBAIN</text>

    <!-- Weber Hexagon Emblem -->
    <g transform="translate(-140, 50) scale(1.4)">
      <polygon points="0,28 14,0 42,0 56,28 42,56 14,56" fill="#FEE000"/>
      <polygon points="28,0 42,0 56,28 42,56 28,56 42,28" fill="#111111"/>
      <polygon points="14,28 21,14 35,14 28,28 35,42 21,42" fill="#FFFFFF"/>
    </g>

    <!-- Weber Modern Typography -->
    <text x="-35" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-0.045em" fill="#111111">weber</text>
  </g>

  <!-- Subtitle Lockup -->
  <text x="450" y="800" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em" fill="#111111" text-anchor="middle">Saint-Gobain Weber</text>
  <text x="450" y="835" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0.14em" fill="#666666" text-anchor="middle">YAPI KİMYASALLARI &amp; SERAMİK HARÇLARI</text>

  <!-- Bottom Accent -->
  <line x1="410" y1="900" x2="490" y2="900" stroke="#111111" stroke-width="1"/>
  <text x="450" y="1040" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0.18em" fill="#999999" text-anchor="middle">WEBERKOL • WEBERTEC • WEBERDRY</text>
</svg>