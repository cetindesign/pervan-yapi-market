<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Pure white minimal canvas with hairline border -->
  <rect width="900" height="1200" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

  <!-- Centered Dominant Saint-Gobain Weber Official Logo -->
  <g transform="translate(450, 600)">
    <!-- Saint-Gobain Wave Bridge (Large, crisp) -->
    <g transform="translate(0, -220)">
      <path d="M -180,-30 C -95,-130 95,-130 180,-30 C 150,-10 -150,-10 -180,-30 Z" fill="#0072CE"/>
      <path d="M -155,-30 C -80,-115 80,-115 155,-30 C 130,-12 -130,-12 -155,-30 Z" fill="#00A3E0"/>
      <path d="M -130,-30 C -65,-98 65,-98 130,-30 C 110,-15 -110,-15 -130,-30 Z" fill="#43B02A"/>
      <path d="M -105,-30 C -50,-80 50,-80 105,-30 C 88,-18 -88,-18 -105,-30 Z" fill="#FFB81C"/>
      <path d="M -80,-30 C -35,-65 35,-65 80,-30 C 65,-20 -65,-20 -80,-30 Z" fill="#E05A47"/>
      <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="0.26em" fill="#222222" text-anchor="middle">SAINT-GOBAIN</text>
    </g>

    <!-- Weber Hexagon + weber Wordmark (Large, dominant) -->
    <g transform="translate(0, 140)">
      <!-- Hexagon emblem (scale 2.6) -->
      <g transform="translate(-270, -75) scale(2.6)">
        <polygon points="0,28 14,0 42,0 56,28 42,56 14,56" fill="#FEE000"/>
        <polygon points="28,0 42,0 56,28 42,56 28,56 42,28" fill="#111111"/>
        <polygon points="14,28 21,14 35,14 28,28 35,42 21,42" fill="#FFFFFF"/>
      </g>
      <!-- weber wordmark -->
      <text x="-90" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="124" font-weight="900" letter-spacing="-0.045em" fill="#111111">weber</text>
    </g>
  </g>
</svg>