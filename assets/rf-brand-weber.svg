<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Pure White Canvas with subtle hairline border -->
  <rect width="900" height="1200" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

  <!-- Saint-Gobain Arc Bridge at Top -->
  <g transform="translate(450, 160)">
    <path d="M -180,-10 C -95,-105 95,-105 180,-10 C 150,10 -150,10 -180,-10 Z" fill="#0072CE"/>
    <path d="M -155,-10 C -80,-90 80,-90 155,-10 C 130,8 -130,8 -155,-10 Z" fill="#00A3E0"/>
    <path d="M -130,-10 C -65,-75 65,-75 130,-10 C 110,6 -110,6 -130,-10 Z" fill="#43B02A"/>
    <path d="M -105,-10 C -50,-60 50,-60 105,-10 C 88,4 -88,4 -105,-10 Z" fill="#FFB81C"/>
    <path d="M -80,-10 C -35,-45 35,-45 80,-10 C 65,2 -65,2 -80,-10 Z" fill="#E05A47"/>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="0.32em" fill="#333333" text-anchor="middle">SAINT-GOBAIN</text>
  </g>

  <!-- MASSIVE WEBER HEXAGON EMBLEM (600px wide, centered) -->
  <g transform="translate(450, 580) scale(9.5)">
    <!-- Centered 56x56 polygon shifted to center (-28, -28) -->
    <g transform="translate(-28, -28)">
      <polygon points="0,28 14,0 42,0 56,28 42,56 14,56" fill="#FEE000"/>
      <polygon points="28,0 42,0 56,28 42,56 28,56 42,28" fill="#111111"/>
      <polygon points="14,28 21,14 35,14 28,28 35,42 21,42" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Bold weber Typography -->
  <text x="450" y="1010" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="900" letter-spacing="-0.045em" fill="#111111" text-anchor="middle">weber</text>
  <text x="450" y="1065" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0.22em" fill="#666666" text-anchor="middle">YAPI KİMYASALLARI &amp; TEKNİK HARÇLAR</text>
</svg>