<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Clean minimal architectural canvas -->
  <rect width="900" height="1200" fill="#F8F8F7"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>

  <!-- Centered Dominant Lockup -->
  <g transform="translate(450, 480)">
    <!-- Saint-Gobain Arc Bridge (Large & Vibrant) -->
    <path d="M -150,-140 C -80,-215 80,-215 150,-140 C 125,-122 -125,-122 -150,-140 Z" fill="#0072CE"/>
    <path d="M -130,-140 C -70,-200 70,-200 130,-140 C 110,-125 -110,-125 -130,-140 Z" fill="#00A3E0"/>
    <path d="M -110,-140 C -55,-185 55,-185 110,-140 C 90,-128 -90,-128 -110,-140 Z" fill="#43B02A"/>
    <path d="M -90,-140 C -40,-170 40,-170 90,-140 C 70,-130 -70,-130 -90,-140 Z" fill="#FFB81C"/>
    <path d="M -70,-140 C -25,-155 25,-155 70,-140 C 55,-133 -55,-133 -70,-140 Z" fill="#E05A47"/>

    <!-- SAINT-GOBAIN Header -->
    <text x="0" y="-70" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="0.28em" fill="#222222" text-anchor="middle">SAINT-GOBAIN</text>

    <!-- Weber Hexagon Emblem (Large 1.9x) -->
    <g transform="translate(-215, 20) scale(2.0)">
      <polygon points="0,28 14,0 42,0 56,28 42,56 14,56" fill="#FEE000"/>
      <polygon points="28,0 42,0 56,28 42,56 28,56 42,28" fill="#111111"/>
      <polygon points="14,28 21,14 35,14 28,28 35,42 21,42" fill="#FFFFFF"/>
    </g>

    <!-- weber Heavy Wordmark -->
    <text x="-75" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="900" letter-spacing="-0.045em" fill="#111111">weber</text>
  </g>

  <!-- Subtitle -->
  <text x="450" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em" fill="#111111" text-anchor="middle">Saint-Gobain Weber</text>
  <text x="450" y="925" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.22em" fill="#666666" text-anchor="middle">YETKİLİ DAĞITICI BAYİ</text>
</svg>