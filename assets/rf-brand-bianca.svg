<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="1200" fill="#F8F8F7"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>

  <!-- Top Category Tag -->
  <text x="450" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0.22em" fill="#888888" text-anchor="middle">YETKİLİ UYGULAMA MERKEZİ</text>

  <!-- Bianca Stella Official Logo Lockup -->
  <g transform="translate(450, 520)">
    <!-- Star / Sparkle Icon Above Stella -->
    <path d="M 120,-75 L 126,-55 L 146,-49 L 126,-43 L 120,-23 L 114,-43 L 94,-49 L 114,-55 Z" fill="#2D81B1"/>

    <!-- Wordmark Line -->
    <text x="-160" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" letter-spacing="-0.02em" fill="#17345B">Bianca</text>
    <text x="75" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-0.03em" fill="#2D81B1">Stella</text>

    <!-- Sub-tag DÖNÜŞÜM BOYASI -->
    <rect x="-180" y="32" width="360" height="30" fill="none" stroke="#2D81B1" stroke-width="1"/>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.25em" fill="#17345B" text-anchor="middle">DÖNÜŞÜM BOYASI</text>
  </g>

  <!-- Clean Subtitle Lockup -->
  <text x="450" y="800" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em" fill="#111111" text-anchor="middle">Bianca Stella</text>
  <text x="450" y="835" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0.14em" fill="#666666" text-anchor="middle">SERAMİK, FAYANS &amp; TEZGAH YENİLEME</text>

  <!-- Bottom Accent -->
  <line x1="410" y1="900" x2="490" y2="900" stroke="#111111" stroke-width="1"/>
  <text x="450" y="1040" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0.18em" fill="#999999" text-anchor="middle">KIRMADAN DÖKMEDEN MİMARİ DÖNÜŞÜM</text>
</svg>