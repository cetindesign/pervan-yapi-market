<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Pure white minimal canvas with hairline border -->
  <rect width="900" height="1200" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

  <!-- Centered Dominant Bianca Stella Official Logo -->
  <g transform="translate(450, 600)">
    <!-- Sparkle Star Icon -->
    <path d="M 230,-155 L 241,-115 L 281,-104 L 241,-93 L 230,-53 L 219,-93 L 179,-104 L 219,-115 Z" fill="#2D81B1"/>

    <!-- Dominant Wordmark -->
    <text x="-300" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="142" font-weight="700" letter-spacing="-0.02em" fill="#152F54">Bianca</text>
    <text x="145" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="140" font-weight="800" letter-spacing="-0.03em" fill="#2D81B1">Stella</text>

    <!-- Prominent DÖNÜŞÜM BOYASI Badge -->
    <rect x="-310" y="60" width="620" height="58" fill="none" stroke="#2D81B1" stroke-width="2"/>
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="0.25em" fill="#152F54" text-anchor="middle">DÖNÜŞÜM BOYASI</text>
  </g>
</svg>