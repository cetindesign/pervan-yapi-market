<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Clean minimal architectural canvas -->
  <rect width="900" height="1200" fill="#F8F8F7"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>

  <!-- Centered Dominant Bianca Stella Logo -->
  <g transform="translate(450, 520)">
    <!-- Large Star Accent -->
    <path d="M 180,-115 L 189,-85 L 219,-76 L 189,-67 L 180,-37 L 171,-67 L 141,-76 L 171,-85 Z" fill="#2D81B1"/>

    <!-- Dominant Bianca (Serif) + Stella (Sans) -->
    <text x="-240" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="114" font-weight="700" letter-spacing="-0.02em" fill="#17345B">Bianca</text>
    <text x="115" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-0.03em" fill="#2D81B1">Stella</text>

    <!-- Prominent DÖNÜŞÜM BOYASI Badge -->
    <rect x="-260" y="48" width="520" height="46" fill="none" stroke="#2D81B1" stroke-width="1.5"/>
    <text x="0" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="0.25em" fill="#17345B" text-anchor="middle">DÖNÜŞÜM BOYASI</text>
  </g>

  <!-- Subtitle -->
  <text x="450" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em" fill="#111111" text-anchor="middle">Bianca Stella</text>
  <text x="450" y="925" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.22em" fill="#666666" text-anchor="middle">YETKİLİ UYGULAMA MERKEZİ</text>
</svg>