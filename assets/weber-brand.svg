<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="100%" height="100%">
  <!-- Left: Saint-Gobain Arc Lockup -->
  <g transform="translate(65, 48)">
    <path d="M -48,-12 C -24,-40 24,-40 48,-12 C 38,-5 -38,-5 -48,-12 Z" fill="#0072CE"/>
    <path d="M -40,-12 C -19,-34 19,-34 40,-12 C 32,-6 -32,-6 -40,-12 Z" fill="#00A3E0"/>
    <path d="M -32,-12 C -14,-28 14,-28 32,-12 C 25,-7 -25,-7 -32,-12 Z" fill="#43B02A"/>
    <path d="M -24,-12 C -9,-22 9,-22 24,-12 C 19,-8 -19,-8 -24,-12 Z" fill="#FFB81C"/>
    <path d="M -16,-12 C -5,-16 5,-16 16,-12 C 12,-9 -12,-9 -16,-12 Z" fill="#E05A47"/>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="0.25em" fill="#222222" text-anchor="middle">SAINT-GOBAIN</text>
  </g>

  <!-- Clean Vertical Divider -->
  <line x1="130" y1="18" x2="130" y2="78" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Right: Weber Hexagon & Wordmark -->
  <g transform="translate(150, 16)">
    <!-- Hexagon emblem (scale 1.15) -->
    <g transform="translate(0, 4) scale(1.15)">
      <polygon points="0,28 14,0 42,0 56,28 42,56 14,56" fill="#FEE000"/>
      <polygon points="28,0 42,0 56,28 42,56 28,56 42,28" fill="#111111"/>
      <polygon points="14,28 21,14 35,14 28,28 35,42 21,42" fill="#FFFFFF"/>
    </g>
    <!-- weber wordmark -->
    <text x="80" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-0.045em" fill="#111111">weber</text>
  </g>
</svg>