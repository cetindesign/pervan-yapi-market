<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 8 270 66" width="100%" height="100%">
  <!-- Yellow-Black Weber Hexagon Emblem -->
  <g transform="translate(10, 13)">
    <polygon points="0,28 14,0 42,0 56,28 42,56 14,56" fill="#FEE000"/>
    <polygon points="28,0 42,0 56,28 42,56 28,56 42,28" fill="#111111"/>
    <polygon points="14,28 21,14 35,14 28,28 35,42 21,42" fill="#FFFFFF"/>
  </g>

  <!-- weber Wordmark -->
  <text x="80" y="53" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.045em" fill="#111111">weber</text>

  <!-- SAINT-GOBAIN Endorsement -->
  <text x="82" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.22em" fill="#444444">SAINT-GOBAIN</text>
</svg>