<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_webergrout-dry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B2A"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="fold_webergrout-dry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E4E2"/>
      <stop offset="100%" stop-color="#B8B7B5"/>
    </linearGradient>
  </defs>

  <!-- Bag Top Fold / Valve -->
  <polygon points="28,24 132,24 126,14 34,14" fill="url(#fold_webergrout-dry)" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
  
  <!-- Main Bag Body -->
  <path d="M 26,24 L 134,24 L 138,168 A 12 12 0 0 1 126,180 L 34,180 A 12 12 0 0 1 22,168 Z" fill="url(#bg_webergrout-dry)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Saint-Gobain Arc Logo on Bag Top -->
  <g transform="translate(80, 44) scale(0.48)">
    <path d="M -50,-10 C -25,-38 25,-38 50,-10 C 40,-3 -40,-3 -50,-10 Z" fill="#0072CE"/>
    <path d="M -42,-10 C -20,-32 20,-32 42,-10 C 33,-4 -33,-4 -42,-10 Z" fill="#00A3E0"/>
    <path d="M -34,-10 C -15,-26 15,-26 34,-10 C 26,-5 -26,-5 -34,-10 Z" fill="#43B02A"/>
    <path d="M -26,-10 C -10,-20 10,-20 26,-10 C 20,-6 -20,-6 -26,-10 Z" fill="#FFB81C"/>
    <path d="M -18,-10 C -6,-14 6,-14 18,-10 C 14,-7 -14,-7 -18,-10 Z" fill="#E05A47"/>
  </g>

  <!-- Weber Hexagon Emblem -->
  <g transform="translate(32, 60) scale(0.75)">
    <polygon points="0,16 8,0 24,0 32,16 24,32 8,32" fill="#FEE000"/>
    <polygon points="16,0 24,0 32,16 24,32 16,32 24,16" fill="#111111"/>
    <polygon points="8,16 12,8 20,8 16,16 20,24 12,24" fill="#FFFFFF"/>
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">weber</text>
  </g>

  <!-- Product Label Center Card -->
  <rect x="28" y="92" width="104" height="52" rx="4" fill="#FFFFFF"/>
  
  <!-- Product Name in Badge -->
  <text x="34" y="108" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#111111">webergrout dry</text>
  
  <!-- Standard Code Chip -->
  <rect x="34" y="114" width="70.4" height="13" rx="3" fill="#FEE000"/>
  <text x="38" y="123.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7.5" font-weight="800" fill="#111111">1504-6</text>

  <!-- Weight / Size Tag -->
  <text x="34" y="137" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7" font-weight="600" fill="#71717A">25 kg Kraft Torba</text>

  <!-- Yellow Base Band -->
  <path d="M 23.5,156 L 136.5,156 A 12 12 0 0 1 126,180 L 34,180 A 12 12 0 0 1 23.5,156 Z" fill="#FEE000"/>
  <text x="80" y="171" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.08em" fill="#111111" text-anchor="middle">SAINT-GOBAIN</text>
</svg>