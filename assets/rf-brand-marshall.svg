<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Pure White Canvas with subtle hairline border -->
  <rect width="900" height="1200" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

  <!-- Background subtle warm radiant glow -->
  <defs>
    <radialGradient id="marshallGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFF1F2" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4002B"/>
      <stop offset="35%" stop-color="#FF4D6D"/>
      <stop offset="70%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#0096C7"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#marshallGlow)"/>

  <!-- AkzoNobel Top Badge -->
  <g transform="translate(450, 160)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="0.3em" fill="#475569" text-anchor="middle">AKZONOBEL COATINGS</text>
    <line x1="-120" y1="16" x2="120" y2="16" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Central Visual: Iconic Dynamic Ribbon Arc & Marshall Paint Can Motif -->
  <g transform="translate(450, 530)">
    <!-- Flourish Color Splash Ribbon -->
    <path d="M -280,-120 C -180,-240 80,-260 260,-130 C 320,-85 340,-20 300,50 C 250,140 100,160 -40,120 C -160,85 -260,-20 -280,-120 Z" fill="none" stroke="url(#ribbonGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M -220,-80 C -140,-180 70,-190 210,-90 C 250,-60 260,-10 230,40 C 190,105 80,120 -30,90" fill="none" stroke="#E4002B" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Stylized Iconic Metal Paint Cylinder / Packshot -->
    <g transform="translate(0, 30)">
      <!-- Can Body Shadow -->
      <ellipse cx="0" cy="180" rx="160" ry="35" fill="rgba(0,0,0,0.12)"/>
      <!-- Can Base -->
      <rect x="-150" y="-110" width="300" height="280" rx="24" fill="#1E293B"/>
      <!-- Inner Label -->
      <rect x="-140" y="-95" width="280" height="250" rx="16" fill="#0F172A"/>
      <!-- Metal Trim Top -->
      <ellipse cx="0" cy="-110" rx="150" ry="30" fill="#94A3B8"/>
      <ellipse cx="0" cy="-115" rx="140" ry="25" fill="#E2E8F0"/>
      <!-- Can Label Badge -->
      <rect x="-115" y="-40" width="230" height="125" rx="12" fill="#E4002B"/>
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="900" font-style="italic" letter-spacing="-0.03em" fill="#FFFFFF" text-anchor="middle">Marshall</text>
      <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="0.22em" fill="#FFE4E6" text-anchor="middle">FIT PARLAK &amp; CAM CİLA</text>
      <!-- Gold Quality Seal -->
      <circle cx="0" cy="115" r="22" fill="#EAB308"/>
      <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#1E293B" text-anchor="middle">PREMIUM</text>
    </g>
  </g>

  <!-- Typography at bottom -->
  <text x="450" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="900" font-style="italic" letter-spacing="-0.03em" fill="#E4002B" text-anchor="middle">Marshall</text>
  <text x="450" y="1075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.24em" fill="#64748B" text-anchor="middle">SENTETİK, CAM CİLA &amp; AKRİKOR YETKİLİ BAYİ</text>
</svg>