<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Pure White Canvas with subtle hairline border -->
  <rect width="900" height="1200" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

  <!-- MASSIVE ISONEM WATERPROOF SHIELD EMBLEM (560px wide, centered) -->
  <g transform="translate(450, 500)">
    <!-- Architectural Shield Background -->
    <path d="M 0,-240 L 220,-140 L 220,70 C 220,180 120,250 0,290 C -120,250 -220,180 -220,70 L -220,-140 Z" fill="#F0F4F8" stroke="#132B4F" stroke-width="6"/>
    
    <!-- Protective Liquid Glass Droplet (Vibrant Gradient / Dual-tone) -->
    <path d="M 0,-150 C 0,-150 120,0 120,80 C 120,146 66,200 0,200 C -66,200 -120,146 -120,80 C -120,0 0,-150 0,-150 Z" fill="#132B4F"/>
    
    <!-- Surface Protection Accent (Orange Barrier) -->
    <path d="M -80,90 C -60,150 0,160 0,160 C 0,160 60,150 80,90 C 80,90 40,110 0,110 C -40,110 -80,90 -80,90 Z" fill="#E24B00"/>
    
    <!-- Liquid Glass Reflection Highlight -->
    <path d="M -30,-40 C -10,-100 0,-115 0,-115 C 0,-115 -50,-10 -50,60 C -50,85 -35,115 -35,115 C -35,115 -60,70 -60,40 C -60,-10 -30,-40 -30,-40 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Surrounding Concentric Wave Rings -->
    <path d="M -160,20 C -160,120 -80,180 0,210 C 80,180 160,120 160,20" fill="none" stroke="#E24B00" stroke-width="4" stroke-dasharray="12 12"/>
  </g>

  <!-- Dominant iSONEM Official Wordmark -->
  <g transform="translate(450, 950)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="110" font-weight="900" letter-spacing="-0.04em" fill="#132B4F" text-anchor="middle">
      <tspan fill="#E24B00">i</tspan>SONEM
    </text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="0.28em" fill="#555555" text-anchor="middle">PAINT &amp; INSULATION TECHNOLOGIES</text>
  </g>
</svg>