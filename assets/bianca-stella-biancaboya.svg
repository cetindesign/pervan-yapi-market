w-6" style="background-color:#877BBC;opacity:0;transform:translateY(10px) scale(0)"></span><span class="h-3.5 w-3.5 rounded-full ring-2 ring-black/10 shadow-md sm:h-5 sm:w-5 lg:h-6 lg:w-6" style="background-color:#BFB1D2;opacity:0;transform:translateY(10px) scale(0)"></span><span class="h-3.5 w-3.5 rounded-full ring-2 ring-black/10 shadow-md sm:h-5 sm:w-5 lg:h-6 lg:w-6" style="background-color:#7C6C89;opacity:0;transform:translateY(10px) scale(0)"></span><span class="h-3.5 w-3.5 rounded-full ring-2 ring-black/10 shadow-md sm:h-5 sm:w-5 lg:h-6 lg:w-6" style="background-color:#7A5A84;opacity:0;transform:translateY(10px) scale(0)"></span><span class="h-3.5 w-3.5 rounded-full ring-2 ring-black/10 shadow-md sm:h-5 sm:w-5 lg:h-6 lg:w-6" style="background-color:#956E93;opacity:0;transform:translateY(10px) scale(0)"></span><span class="h-3.5 w-3.5 rounded-full ring-2 ring-black/10 shadow-md sm:h-5 sm:w-5 lg:h-6 lg:w-6" style="background-color:#A0547C;opacity:0;transform:translateY(10px) scale(0)"></span><span class="h-3.5 w-3.5 rounded-full ring-2 ring-black/10 shadow-md sm:h-5 sm:w-5 lg:h-6 lg:w-6" style="background-color:#B0526C;opacity:0;transform:translateY(10px) scale(0)"></span><span class="h-3.5 w-3.5 rounded-full ring-2 ring-black/10 shadow-md sm:h-5 sm:w-5 lg:h-6 lg:w-6" style="background-color:#CF4E55;opacity:0;transform:translateY(10px) scale(0)"></span></div></div></div></section><section class="bg-white px-4 lg:px-6 py-12 md:py-24"><div class="max-w-7xl mx-auto"><div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-8 border-b border-gray-200 pb-6"><div><p class="text-xs md:text-sm font-bold tracking-[0.2em] uppercase mb-2" style="color:#0054a6">RENK, FİKİR, DÖNÜŞÜM</p><h2 class="text-3xl md:text-5xl font-bold tracking-tight text-[#003d7a] leading-[1.05]" style="font-family:&quot;DAX Pro&quot;, sans-serif"><span class="font-light">Yeni fikirler,</span><span class="font-bold"> trend renkler</span><br class="md:hidden"/><span class="font-light"> ve ilham veren </span><br class="hidden md:block"/><span class="font-bold">dönüşüm önerileri.</span></h2></div><a href="/blog" style="color:#0054a6" class="inline-flex items-center gap-1 text-sm font-semibold uppercase tracking-[0.12em] hover:gap-2 transition-all min-h-11">Tüm Yazılar <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right w-4 h-4" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a></div><div class="flex h-80 md:h-96 w-full gap-0.5"><div class="flex-1 animate-pulse bg-gray-100"></div><div class="flex-1 animate-pulse bg-gray-100"></div><div class="flex-1 animate-pulse bg-gray-100"></div><div class="flex-1 animate-pulse bg-gray-100"></div><div class="flex-1 animate-pulse bg-gray-100"></div><div class="flex-1 animate-pulse bg-gray-100"></div><div class="flex-1 animate-pulse bg-gray-100"></div></div></div></section><section class="bg-white px-4 py-16 lg:px-6 md:py-24"><div class="mx-auto max-w-4xl"><h2 class="text-2xl font-semibold tracking-tight text-gray-900 md:text-3xl">Bianca Boya rehberi: doğru ürün, doğru renk, doğru uygulama</h2><p class="mt-4 text-[15px] leading-relaxed text-gray-600">Bianca Boya; iç cephe, dış cephe, ahşap ve metal yüzeyler, dekoratif efektler ve mobilya yenileme için su bazlı boya çözümleri üretir. Bu rehberde bir boyama projesinin tüm adımlarını — yüzey hazırlığından astar seçimine, renk kararından sarfiyat hesabına kadar — uygulamada işinize yarayacak somut değerlerle özetledik.</p><div class="mt-8 border-t border-gray-100"><details open="" class="group border-b border-gray-100"><summary class="flex cursor-pointer list-none items-center gap-3 py-5 text-[15px] font-semibold text-gray-900 md:text-lg [&amp;::-webkit-details-marker]:hidden"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-4 w-4" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h3 class="font-semibold">Hangi yüzeye hangi ürün grubu?</h3></summary><div class="pb-6 pl-0 md:pl-10"><div class="overflow-x-auto"><table class="w-full min-w-[560px] border-collapse text-left text-sm"><thead><tr class="border-b border-gray-200 text-gray-500"><th class="py-2 pr-4 font-medium">Yüzey</th><th class="py-2 pr-4 font-medium">Önerilen ürün grubu</th><th class="py-2 font-medium">Notlar</th></tr></thead><tbody class="text-gray-700"><tr class="border-b border-gray-100"><td class="py-2.5 pr-4">Alçı, sıva, saten alçı (iç mekân)</td><td class="py-2.5 pr-4">İç cephe su bazlı boyalar</td><td class="py-2.5">Astar + iki ince kat; silinebilirlik salon ve koridorda önemli.</td></tr><tr class="border-b border-gray-100"><td class="py-2.5 pr-4">Beton, brüt beton, ısı yalıtım sıvası</td><td class="py-2.5 pr-4">Dış cephe boyaları</td><td class="py-2.5">UV ve don direnci; nefes alabilen, su itici film gerekir.</td></tr><tr class="border-b border-gray-100"><td class="py-2.5 pr-4">Mutfak dolabı, MDF, lake mobilya</td><td class="py-2.5 pr-4">Bianca Stella</td><td class="py-2.5">Zımpara → Stella astar → iki ince kat; 0,5 lt ve 1 lt ambalaj.</td></tr><tr class="border-b border-gray-100"><td class="py-2.5 pr-4">Ahşap doğrama, pergole, bahçe mobilyası</td><td class="py-2.5 pr-4">Ahşap koruyucu ve verniklerimiz</td><td class="py-2.5">Dış mekânda 2–3 yılda bir bakım katı önerilir.</td></tr><tr><td class="py-2.5 pr-4">Duvarda dekoratif doku, mermer/metal efekt</td><td class="py-2.5 pr-4">Artistico serisi</td><td class="py-2.5">Efekt malası veya sünger ile katmanlı uygulama.</td></tr></tbody></table></div></div></details><details class="group border-b border-gray-100"><summary class="flex cursor-pointer list-none items-center gap-3 py-5 text-[15px] font-semibold text-gray-900 md:text-lg [&amp;::-webkit-details-marker]:hidden"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-4 w-4" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h3 class="font-semibold">Adım adım duvar boyama</h3></summary><div class="pb-6 pl-0 md:pl-10"><ol class="space-y-4"><li class="flex gap-4"><span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-sm font-semibold text-[#0054A6]">1</span><div><h4 class="text-[15px] font-semibold text-gray-900">Yüzeyi hazırlayın</h4><p class="mt-1 text-sm leading-relaxed text-gray-600">Eski kabarmış boyayı kazıyın, çatlak ve delikleri macunlayın, kuruduktan sonra zımparalayıp tozunu alın. Yağ ve is lekelerini deterjanlı suyla temizleyip kurumasını bekleyin.</p></div></li><li class="flex gap-4"><span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-sm font-semibold text-[#0054A6]">2</span><div><h4 class="text-[15px] font-semibold text-gray-900">Uygun astarı uygulayın</h4><p class="mt-1 text-sm leading-relaxed text-gray-600">Yüzey tipine uygun Bianca astarını tek kat, homojen şekilde uygulayın. Emiciliği yüksek yüzeylerde astar, boya sarfiyatını ve renk farkı riskini belirgin şekilde azaltır.</p></div></li><li class="flex gap-4"><span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-sm font-semibold text-[#0054A6]">3</span><div><h4 class="text-[15px] font-semibold text-gray-900">Boya miktarını hesaplayın</h4><p class="mt-1 text-sm leading-relaxed text-gray-600">Duvar alanını (en × yükseklik) hesaplayıp kapı–pencere alanını çıkarın. Toplam alanı litre başına verim değerine bölün ve iki kat için ikiyle çarpın. LiveColor raporu bu hesabı otomatik yapar.</p></div></li><li class="flex gap-4"><span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-sm font-semibold text-[#0054A6]">4</span><div><h4 class="text-[15px] font-semibold text-gray-900">Rengi karıştırın ve deneyin</h4><p class="mt-1 text-sm leading-relaxed text-gray-600">Aynı renkten birden fazla kutu kullanacaksanız ton farkı olmaması için hepsini büyük bir kapta karıştırın. Küçük bir alanda deneme yapıp kuruduktan sonraki rengi görün.</p></div></li><li class="flex gap-4"><span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-sm font-semibold text-[#0054A6]">5</span><div><h4 class="text-[15px] font-semibold text-gray-900">İki ince kat uygulayın</h4><p class="mt-1 text-sm leading-relaxed text-gray-600">Kenarları fırçayla kesin, geniş alanları rulo ile yukarıdan aşağıya “W” hareketiyle boyayın. İlk kat kuruduktan sonra (4–6 saat) ikinci katı uygulayın.</p></div></li><li class="flex gap-4"><span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-sm font-semibold text-[#0054A6]">6</span><div><h4 class="text-[15px] font-semibold text-gray-900">Havalandırın ve koruyun</h4><p class="mt-1 text-sm leading-relaxed text-gray-600">Mekânı çapraz havalandırın, maskeleme bantlarını boya tam kurumadan alın. Yüzeyi ilk 7 gün boyunca sert temizlik ürünleriyle ovmayın.</p></div></li></ol></div></details><details class="group border-b border-gray-100"><summary class="flex cursor-pointer list-none items-center gap-3 py-5 text-[15px] font-semibold text-gray-900 md:text-lg [&amp;::-webkit-details-marker]:hidden"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-4 w-4" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h3 class="font-semibold">Boya sarfiyatı nasıl hesaplanır?</h3></summary><div class="pb-6 pl-0 md:pl-10"><p class=" text-[15px] leading-relaxed text-gray-600">Sarfiyat, yüzeyin emiciliğine ve uygulama yöntemine göre değişir. Pratik hesap şu şekilde yapılır: boyanacak alan (m²) ÷ litre başına verim × kat sayısı = gereken litre. Ortalama değerler:</p><ul class="mt-4 list-disc space-y-2 pl-5 text-sm leading-relaxed text-gray-600"><li>Astarlı düzgün iç duvar: 1 litre ile tek katta ortalama 8–10 m².</li><li>Astarsız, emici yeni sıva: verim %25–40 oranında düşer.</li><li>Dış cephe dokulu yüzey: 1 litre ile tek katta ortalama 4–6 m².</li><li>Mobilya/dolap kapağı: 1 m² kapak yüzeyi için iki katta yaklaşık 0,15–0,20 litre.</li><li>Rulo yerine tabanca ile uygulamada sarfiyat yaklaşık %10–20 artar.</li></ul><p class="mt-4 text-[15px] leading-relaxed text-gray-600">Odanızın fotoğrafını yükleyip renkleri seçtiğinizde LiveColor, boyanan yüzeyleri ve ölçüleri dikkate alarak litre ve ambalaj kombinasyonunu PDF raporu olarak üretir.</p></div></details><details class="group border-b border-gray-100"><summary class="flex cursor-pointer list-none items-center gap-3 py-5 text-[15px] font-semibold text-gray-900 md:text-lg [&amp;::-webkit-details-marker]:hidden"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-4 w-4" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h3 class="font-semibold">Renk seçerken nelere dikkat edilir?</h3></summary><div class="pb-6 pl-0 md:pl-10"><ul class=" list-disc space-y-2 pl-5 text-sm leading-relaxed text-gray-600"><li><strong class="font-semibold text-gray-800">Işık yönü:</strong> kuzey cephede renkler soğur, sıcak kırık tonlar dengeler; güney cephede tonlar açılır.</li><li><strong class="font-semibold text-gray-800">Oda boyutu:</strong> açık ve düşük doygunluklu tonlar mekânı büyütür, koyu tonlar odaklanma ve derinlik verir.</li><li><strong class="font-semibold text-gray-800">Zemin ve mobilya:</strong> palet, kalıcı olan yüzeylerden (parke, tezgâh, dolap) yola çıkarak kurulur.</li><li><strong class="font-semibold text-gray-800">Parlaklık derecesi:</strong> mat yüzey kusurları gizler, ipek mat ve saten temizliği kolaylaştırır.</li><li><strong class="font-semibold text-gray-800">Deneme:</strong> seçtiğiniz tonu duvarda en az 1 m² alanda deneyip gün ışığında ve yapay ışıkta karşılaştırın.</li></ul></div></details><details class="group border-b border-gray-100"><summary class="flex cursor-pointer list-none items-center gap-3 py-5 text-[15px] font-semibold text-gray-900 md:text-lg [&amp;::-webkit-details-marker]:hidden"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-4 w-4" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h3 class="font-semibold">Sık sorulan sorular</h3></summary><div class="pb-6 pl-0 md:pl-10"><div id="sss" class="divide-y divide-gray-100 border-y border-gray-100"><details class="group py-4"><summary class="flex cursor-pointer list-none items-start gap-3 text-[15px] font-medium text-gray-900 [&amp;::-webkit-details-marker]:hidden"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-3.5 w-3.5" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h4 class="font-medium">İç cephe boyası ile dış cephe boyası arasındaki fark nedir?</h4></summary><p class="mt-3 pl-9 text-sm leading-relaxed text-gray-600">İç cephe boyaları koku, silinebilirlik ve mat/ipek mat görünüm için optimize edilir; kapatıcılık ve uygulama kolaylığı öne çıkar. Dış cephe boyaları ise UV ışınlarına, yağmura, don–çözülme döngüsüne ve küf–yosun oluşumuna karşı dayanıklı, su itici ancak nefes alabilen bir film oluşturur. Bu nedenle iç mekân boyası dış cephede kullanılmamalıdır.</p></details><details class="group py-4"><summary class="flex cursor-pointer list-none items-start gap-3 text-[15px] font-medium text-gray-900 [&amp;::-webkit-details-marker]:hidden"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-3.5 w-3.5" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h4 class="font-medium">1 litre boya kaç metrekare alan boyar?</h4></summary><p class="mt-3 pl-9 text-sm leading-relaxed text-gray-600">Tek katta 1 litre su bazlı iç cephe boyası, düzgün ve astarlanmış yüzeyde ortalama 8–10 m² alanı kapatır. İki kat uygulamada bu değer 4–5 m²&#x27;ye düşer. Emici, gözenekli veya ilk kez boyanan yüzeylerde sarfiyat artar. Kendi odanız için net rakamı LiveColor ile fotoğraf yükleyerek veya “Nereye Ne Kadar Boya Gider” sayfasındaki sarfiyat tablolarından hesaplayabilirsiniz.</p></details><details class="group py-4"><summary class="flex cursor-pointer list-none items-start gap-3 text-[15px] font-medium text-gray-900 [&amp;::-webkit-details-marker]:hidden"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-3.5 w-3.5" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h4 class="font-medium">Boyamadan önce astar kullanmak şart mı?</h4></summary><p class="mt-3 pl-9 text-sm leading-relaxed text-gray-600">Yeni sıva, alçı, saten alçı, eski boyalı ve emiciliği yüksek yüzeylerde astar zorunludur. Astar; yüzey emiciliğini dengeler, boyanın aderansını artırır, renk homojenliği sağlar ve toplam boya sarfiyatını düşürür. Yüzey tipine uygun Bianca astarı seçmek, iki kat boyayla istenen kapatıcılığa ulaşmanın en ekonomik yoludur.</p></details><details class="group py-4"><summary class="flex cursor-pointer list-none items-start gap-3 text-[15px] font-medium text-gray-900 [&amp;::-webkit-details-marker]:hidden"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-3.5 w-3.5" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h4 class="font-medium">Boyanın kuruma ve ikinci kat süresi ne kadardır?</h4></summary><p class="mt-3 pl-9 text-sm leading-relaxed text-gray-600">Su bazlı boyalarda 20 °C ve %65 bağıl nemde dokunma kuruması yaklaşık 1 saat, katlar arası bekleme 4–6 saattir. Tam sertleşme (film mukavemetinin oluşması) 7 güne kadar sürebilir. Düşük sıcaklık ve yüksek nem bu süreleri uzatır; 5 °C altında ve doğrudan güneş alan sıcak yüzeylerde uygulama yapılmamalıdır.</p></details><details class="group py-4"><summary class="flex cursor-pointer list-none items-start gap-3 text-[15px] font-medium text-gray-900 [&amp;::-webkit-details-marker]:hidden"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-3.5 w-3.5" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h4 class="font-medium">Renk seçimini nasıl yapmalıyım?</h4></summary><p class="mt-3 pl-9 text-sm leading-relaxed text-gray-600">Renk, aydınlatmaya göre değişir: kuzeye bakan odalar sıcak tonlarla dengelenir, güney cepheler soğuk ve kırık tonları kaldırır. Doğru yaklaşım; kartelada beğendiğiniz 2–3 tonu duvara deneyip gün ışığı ve akşam ışığında görmek. Daha hızlı sonuç için LiveColor ile kendi odanızın fotoğrafında rengi önizleyebilir, ColorLab’de karakter ve burç temelli palet önerileri alabilirsiniz.</p></details><details class="group py-4"><summary class="flex cursor-pointer list-none items-start gap-3 text-[15px] font-medium text-gray-900 [&amp;::-webkit-details-marker]:hidden"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-3.5 w-3.5" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h4 class="font-medium">Mutfak dolabı ve mobilya hangi boya ile boyanır?</h4></summary><p class="mt-3 pl-9 text-sm leading-relaxed text-gray-600">Ahşap, MDF, lake ve laminat dolap kapaklarında Bianca Stella ürün ailesi kullanılır. Yüzey hafifçe zımparalanıp tozu alınır, uygun Stella astarı çekilir ve iki ince kat halinde boya uygulanır. Kalın tek kat yerine ince katlar; iz bırakmayan, darbeye ve temizliğe dayanıklı bir yüzey verir.</p></details><details class="group py-4"><summary class="flex cursor-pointer list-none items-start gap-3 text-[15px] font-medium text-gray-900 [&amp;::-webkit-details-marker]:hidden"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-3.5 w-3.5" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h4 class="font-medium">Boya kokusu ne kadar sürede geçer, sağlığa zararlı mı?</h4></summary><p class="mt-3 pl-9 text-sm leading-relaxed text-gray-600">Su bazlı boyalarda çözücü oranı düşüktür; iyi havalandırılan bir mekânda koku genellikle 24 saat içinde kaybolur. Uygulama sırasında ve sonrasında çapraz havalandırma yapılması, bebek ve alerjik bireylerin bulunduğu odalarda ise boyanın tamamen kuruması beklendikten sonra kullanılması önerilir.</p></details><details class="group py-4"><summary class="flex cursor-pointer list-none items-start gap-3 text-[15px] font-medium text-gray-900 [&amp;::-webkit-details-marker]:hidden"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#0054A6]/10 text-[#0054A6] transition-transform duration-300 group-open:rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus h-3.5 w-3.5" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><h4 class="font-medium">Bianca ürünlerini nereden satın alabilirim?</h4></summary><p class="mt-3 pl-9 text-sm leading-relaxed text-gray-600">Bianca Boya, Türkiye genelinde yetkili bayi ve makineli renk karışım noktaları üzerinden satılır. Size en yakın noktayı Satış Noktaları sayfasındaki il ve ilçe filtresinden bulabilirsiniz. Uygulama desteği ve profesyonel boyacı yönlendirmesi için temsilci ağımızdan da yardım alabilirsiniz.</p></details></div></div></details></div><p class="mt-10 text-sm leading-relaxed text-gray-500">Ürün seçimi, renk kararı veya uygulama konusunda desteğe mi ihtiyacınız var?<!-- --> <a href="/iletisim" class="font-medium text-[#0054A6] underline underline-offset-2">İletişim</a> <!-- -->sayfasından bize ulaşabilir,<!-- --> <a href="/satis-noktalari" class="font-medium text-[#0054A6] underline underline-offset-2">satış noktaları</a> <!-- -->listesinden size en yakın yetkili bayiyi bulabilir,<!-- --> <a href="/hakkimizda" class="font-medium text-[#0054A6] underline underline-offset-2">hakkımızda</a> <!-- -->sayfasından 1999’dan bu yana süren üretim hikâyemizi okuyabilirsiniz.</p></div></section></div><script>(function(t){let s;try{s=JSON.parse(sessionStorage.getItem(t.storageKey)||"{}")}catch(e){console.error(e);return}const c=t.key||window.history.state?.__TSR_key,r=c?s[c]:void 0;if(t.shouldScrollRestoration&&r&&typeof r=="object"&&Object.keys(r).length>0){for(const e in r){const o=r[e];if(!o||typeof o!="object")continue;const l=o.scrol