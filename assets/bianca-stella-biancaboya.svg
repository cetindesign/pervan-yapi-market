rved":"TR","availableLanguage":["Turkish","English"]}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://www.bianca.com.tr/#website","name":"Bianca Boya","url":"https://www.bianca.com.tr/","inLanguage":"tr-TR","publisher":{"@id":"https://www.bianca.com.tr/#organization"},"potentialAction":{"@type":"SearchAction","target":"https://www.bianca.com.tr/blog?q={search_term_string}","query-input":"required name=search_term_string"}},{"@type":"Organization","@id":"https://www.bianca.com.tr/#organization","name":"Bianca Boya","url":"https://www.bianca.com.tr/","logo":"https://www.bianca.com.tr/favicon.png","foundingDate":"1999","description":"1999'dan beri iç cephe, dış cephe, ahşap, metal ve dekoratif efekt boyaları üreten Türk boya markası.","address":{"@type":"PostalAddress","streetAddress":"Karaağaç Mah. Hadımköy İstanbul Cad. No:36","addressLocality":"Büyükçekmece","addressRegion":"İstanbul","addressCountry":"TR"},"contactPoint":[{"@type":"ContactPoint","telephone":"+90-212-858-16-00","contactType":"customer support","areaServed":"TR","availableLanguage":["Turkish","English"]}],"email":"info@biancabola.com"},{"@type":"WebPage","@id":"https://www.bianca.com.tr/#webpage","url":"https://www.bianca.com.tr/","name":"Bianca Boya | Kalitenin Rengi","description":"Dış ve iç cephe boyaları, mantolama ve yalıtım malzemeleri için aradığınız kalite Bianca'da! Yaşam alanlarınızı Bianca Boya ile güzelleştirmek için","inLanguage":"tr-TR","isPartOf":{"@id":"https://www.bianca.com.tr/#website"},"about":{"@id":"https://www.bianca.com.tr/#organization"},"primaryImageOfPage":{"@type":"ImageObject","url":"https://www.bianca.com.tr/__l5e/assets-v1/f70cc5a8-779d-4a3b-8338-9f42120fa88b/og-colorate-selection.jpg"},"datePublished":"2024-01-15","dateModified":"2026-09-03","breadcrumb":{"@id":"https://www.bianca.com.tr/#breadcrumb"}},{"@type":"BreadcrumbList","@id":"https://www.bianca.com.tr/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Ana Sayfa","item":"https://www.bianca.com.tr/"},{"@type":"ListItem","position":2,"name":"Ürünler","item":"https://www.bianca.com.tr/urunler"},{"@type":"ListItem","position":3,"name":"Renkler","item":"https://www.bianca.com.tr/renkler"}]},{"@type":"FAQPage","@id":"https://www.bianca.com.tr/#faq","mainEntity":[{"@type":"Question","name":"İç cephe boyası ile dış cephe boyası arasındaki fark nedir?","acceptedAnswer":{"@type":"Answer","text":"İç cephe boyaları koku, silinebilirlik ve mat/ipek mat görünüm için optimize edilir; kapatıcılık ve uygulama kolaylığı öne çıkar. Dış cephe boyaları ise UV ışınlarına, yağmura, don–çözülme döngüsüne ve küf–yosun oluşumuna karşı dayanıklı, su itici ancak nefes alabilen bir film oluşturur. Bu nedenle iç mekân boyası dış cephede kullanılmamalıdır."}},{"@type":"Question","name":"1 litre boya kaç metrekare alan boyar?","acceptedAnswer":{"@type":"Answer","text":"Tek katta 1 litre su bazlı iç cephe boyası, düzgün ve astarlanmış yüzeyde ortalama 8–10 m² alanı kapatır. İki kat uygulamada bu değer 4–5 m²'ye düşer. Emici, gözenekli veya ilk kez boyanan yüzeylerde sarfiyat artar. Kendi odanız için net rakamı LiveColor ile fotoğraf yükleyerek veya “Nereye Ne Kadar Boya Gider” sayfasındaki sarfiyat tablolarından hesaplayabilirsiniz."}},{"@type":"Question","name":"Boyamadan önce astar kullanmak şart mı?","acceptedAnswer":{"@type":"Answer","text":"Yeni sıva, alçı, saten alçı, eski boyalı ve emiciliği yüksek yüzeylerde astar zorunludur. Astar; yüzey emiciliğini dengeler, boyanın aderansını artırır, renk homojenliği sağlar ve toplam boya sarfiyatını düşürür. Yüzey tipine uygun Bianca astarı seçmek, iki kat boyayla istenen kapatıcılığa ulaşmanın en ekonomik yoludur."}},{"@type":"Question","name":"Boyanın kuruma ve ikinci kat süresi ne kadardır?","acceptedAnswer":{"@type":"Answer","text":"Su bazlı boyalarda 20 °C ve %65 bağıl nemde dokunma kuruması yaklaşık 1 saat, katlar arası bekleme 4–6 saattir. Tam sertleşme (film mukavemetinin oluşması) 7 güne kadar sürebilir. Düşük sıcaklık ve yüksek nem bu süreleri uzatır; 5 °C altında ve doğrudan güneş alan sıcak yüzeylerde uygulama yapılmamalıdır."}},{"@type":"Question","name":"Renk seçimini nasıl yapmalıyım?","acceptedAnswer":{"@type":"Answer","text":"Renk, aydınlatmaya göre değişir: kuzeye bakan odalar sıcak tonlarla dengelenir, güney cepheler soğuk ve kırık tonları kaldırır. Doğru yaklaşım; kartelada beğendiğiniz 2–3 tonu duvara deneyip gün ışığı ve akşam ışığında görmek. Daha hızlı sonuç için LiveColor ile kendi odanızın fotoğrafında rengi önizleyebilir, ColorLab’de karakter ve burç temelli palet önerileri alabilirsiniz."}},{"@type":"Question","name":"Mutfak dolabı ve mobilya hangi boya ile boyanır?","acceptedAnswer":{"@type":"Answer","text":"Ahşap, MDF, lake ve laminat dolap kapaklarında Bianca Stella ürün ailesi kullanılır. Yüzey hafifçe zımparalanıp tozu alınır, uygun Stella astarı çekilir ve iki ince kat halinde boya uygulanır. Kalın tek kat yerine ince katlar; iz bırakmayan, darbeye ve temizliğe dayanıklı bir yüzey verir."}},{"@type":"Question","name":"Boya kokusu ne kadar sürede geçer, sağlığa zararlı mı?","acceptedAnswer":{"@type":"Answer","text":"Su bazlı boyalarda çözücü oranı düşüktür; iyi havalandırılan bir mekânda koku genellikle 24 saat içinde kaybolur. Uygulama sırasında ve sonrasında çapraz havalandırma yapılması, bebek ve alerjik bireylerin bulunduğu odalarda ise boyanın tamamen kuruması beklendikten sonra kullanılması önerilir."}},{"@type":"Question","name":"Bianca ürünlerini nereden satın alabilirim?","acceptedAnswer":{"@type":"Answer","text":"Bianca Boya, Türkiye genelinde yetkili bayi ve makineli renk karışım noktaları üzerinden satılır. Size en yakın noktayı Satış Noktaları sayfasındaki il ve ilçe filtresinden bulabilirsiniz. Uygulama desteği ve profesyonel boyacı yönlendirmesi için temsilci ağımızdan da yardım alabilirsiniz."}}]},{"@type":"HowTo","@id":"https://www.bianca.com.tr/#howto","name":"Adım adım duvar boyama","description":"Yüzey hazırlığından ikinci kata kadar profesyonel sonuç veren duvar boyama adımları.","totalTime":"PT1D","supply":[{"@type":"HowToSupply","name":"Bianca iç cephe boyası"},{"@type":"HowToSupply","name":"Yüzeye uygun Bianca astar"},{"@type":"HowToSupply","name":"Macun ve zımpara"}],"tool":[{"@type":"HowToTool","name":"Rulo"},{"@type":"HowToTool","name":"Fırça"},{"@type":"HowToTool","name":"Maskeleme bandı"}],"step":[{"@type":"HowToStep","position":1,"name":"Yüzeyi hazırlayın","text":"Eski kabarmış boyayı kazıyın, çatlak ve delikleri macunlayın, kuruduktan sonra zımparalayıp tozunu alın. Yağ ve is lekelerini deterjanlı suyla temizleyip kurumasını bekleyin.","url":"https://www.bianca.com.tr/#adim-1"},{"@type":"HowToStep","position":2,"name":"Uygun astarı uygulayın","text":"Yüzey tipine uygun Bianca astarını tek kat, homojen şekilde uygulayın. Emiciliği yüksek yüzeylerde astar, boya sarfiyatını ve renk farkı riskini belirgin şekilde azaltır.","url":"https://www.bianca.com.tr/#adim-2"},{"@type":"HowToStep","position":3,"name":"Boya miktarını hesaplayın","text":"Duvar alanını (en × yükseklik) hesaplayıp kapı–pencere alanını çıkarın. Toplam alanı litre başına verim değerine bölün ve iki kat için ikiyle çarpın. LiveColor raporu bu hesabı otomatik yapar.","url":"https://www.bianca.com.tr/#adim-3"},{"@type":"HowToStep","position":4,"name":"Rengi karıştırın ve deneyin","text":"Aynı renkten birden fazla kutu kullanacaksanız ton farkı olmaması için hepsini büyük bir kapta karıştırın. Küçük bir alanda deneme yapıp kuruduktan sonraki rengi görün.","url":"https://www.bianca.com.tr/#adim-4"},{"@type":"HowToStep","position":5,"name":"İki ince kat uygulayın","text":"Kenarları fırçayla kesin, geniş alanları rulo ile yukarıdan aşağıya “W” hareketiyle boyayın. İlk kat kuruduktan sonra (4–6 saat) ikinci katı uygulayın.","url":"https://www.bianca.com.tr/#adim-5"},{"@type":"HowToStep","position":6,"name":"Havalandırın ve koruyun","text":"Mekânı çapraz havalandırın, maskeleme bantlarını boya tam kurumadan alın. Yüzeyi ilk 7 gün boyunca sert temizlik ürünleriyle ovmayın.","url":"https://www.bianca.com.tr/#adim-6"}]},{"@type":"LocalBusiness","@id":"https://www.bianca.com.tr/#localbusiness","name":"Bianca Boya","url":"https://www.bianca.com.tr/","image":"https://www.bianca.com.tr/favicon.png","parentOrganization":{"@id":"https://www.bianca.com.tr/#organization"},"description":"Türkiye geneli için Bianca Boya dekoratif boya çözümleri — 2026+ renk, su bazlı iç & dış cephe boyaları, profesyonel uygulama ve yetkili bayi ağı.","telephone":"+90-212-858-16-00","address":{"@type":"PostalAddress","streetAddress":"Karaağaç Mah. Hadımköy İstanbul Cad. No:36","addressLocality":"Büyükçekmece","addressRegion":"İstanbul","addressCountry":"TR"},"areaServed":[{"@type":"Country","name":"Türkiye"}],"priceRange":"₺₺"}]}</script><script defer src="/~flock.js" data-proxy-url="/~api/analytics"></script></head><body><div class="relative flex min-h-screen flex-col overflow-x-clip bg-white"><header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-white"><div class="max-w-7xl mx-auto px-4 lg:px-6"><div class="flex items-center justify-between h-16 lg:h-20"><a class="flex items-center active" href="/" data-status="active" aria-current="page"><img src="/__l5e/assets-v1/b329b27d-4361-412c-9f04-23409c9b0b19/logo.webp" alt="Bianca Boya" class="h-10 lg:h-12 w-auto"/></a><nav class="hidden lg:flex items-center gap-1"><div class="relative"><button class="flex items-center gap-1 px-3 py-2 text-sm font-medium rounded-lg transition-colors text-gray-700 hover:text-[#0054a6] hover:bg-gray-50">Ürünler<!-- --> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down w-3.5 h-3.5" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div><div class="relative"><button class="flex items-ce