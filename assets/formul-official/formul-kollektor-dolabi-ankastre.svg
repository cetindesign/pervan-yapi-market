<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brassGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </radialGradient>
    <linearGradient id="pprcWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="pprcGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="30%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="pvcGrey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="pertRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="30%" stop-color="#EF4444"/>
      <stop offset="70%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="150" fill="url(#stageGlow)"/>
  <ellipse cx="200" cy="340" rx="130" ry="24" fill="#0F172A" opacity="0.08"/>
  <g filter="url(#dropShadow)">
    
        <!-- Brass Manifold (Kollektör) -->
        <!-- Top Rail (Flow meters) -->
        <rect x="70" y="110" width="260" height="35" rx="6" fill="url(#brassGrad)" stroke="#854D0E" stroke-width="2"/>
        <!-- Bottom Rail (Valves) -->
        <rect x="70" y="220" width="260" height="35" rx="6" fill="url(#brassGrad)" stroke="#854D0E" stroke-width="2"/>
        
        <!-- Wall Mounting Brackets -->
        <rect x="110" y="90" width="12" height="190" fill="url(#chromeGrad)" stroke="#64748B" stroke-width="1.5"/>
        <rect x="280" y="90" width="12" height="190" fill="url(#chromeGrad)" stroke="#64748B" stroke-width="1.5"/>
        
        <!-- Flow meter glass tubes -->
        <rect x="140" y="80" width="12" height="30" rx="3" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
        <rect x="180" y="80" width="12" height="30" rx="3" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
        <rect x="220" y="80" width="12" height="30" rx="3" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
        <rect x="250" y="80" width="12" height="30" rx="3" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
        
        <!-- Outlets -->
        <rect x="138" y="145" width="16" height="20" fill="url(#brassGrad)" stroke="#854D0E"/>
        <rect x="178" y="145" width="16" height="20" fill="url(#brassGrad)" stroke="#854D0E"/>
        <rect x="218" y="145" width="16" height="20" fill="url(#brassGrad)" stroke="#854D0E"/>
        <rect x="248" y="145" width="16" height="20" fill="url(#brassGrad)" stroke="#854D0E"/>
        
        <rect x="138" y="255" width="16" height="20" fill="url(#brassGrad)" stroke="#854D0E"/>
        <rect x="178" y="255" width="16" height="20" fill="url(#brassGrad)" stroke="#854D0E"/>
        <rect x="218" y="255" width="16" height="20" fill="url(#brassGrad)" stroke="#854D0E"/>
        <rect x="248" y="255" width="16" height="20" fill="url(#brassGrad)" stroke="#854D0E"/>
        
        <text x="145" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#854D0E">PİRİNÇ DEBİLİ KOLLEKTÖR</text>
        
  </g>
</svg>