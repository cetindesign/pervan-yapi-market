<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brassGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </radialGradient>
    <linearGradient id="pprcWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="pprcGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="30%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="pvcGrey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="pertRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="30%" stop-color="#EF4444"/>
      <stop offset="70%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="150" fill="url(#stageGlow)"/>
  <ellipse cx="200" cy="340" rx="130" ry="24" fill="#0F172A" opacity="0.08"/>
  <g filter="url(#dropShadow)">
    
    <!-- Pipe 1 -->
    <rect x="140" y="60" width="45" height="250" rx="8" fill="url(#pprcWhite)" stroke="#94A3B8" stroke-width="1.5"/>
    <ellipse cx="162.5" cy="60" rx="22.5" ry="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <ellipse cx="162.5" cy="60" rx="15" ry="7" fill="#0284C7" opacity="0.85"/>
    <line x1="162.5" y1="75" x2="162.5" y2="295" stroke="#DC2626" stroke-width="3"/>
    
    <!-- Pipe 2 (Foreground) -->
    <rect x="205" y="90" width="60" height="230" rx="10" fill="url(#pprcWhite)" stroke="#94A3B8" stroke-width="1.5"/>
    <ellipse cx="235" cy="90" rx="30" ry="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <ellipse cx="235" cy="90" rx="20" ry="8" fill="#0284C7" opacity="0.85"/>
    <line x1="192" y1="60" x2="192" y2="310" stroke="#EF4444" stroke-width="4" stroke-dasharray="8 8"/>
    
    <line x1="235" y1="110" x2="235" y2="305" stroke="#DC2626" stroke-width="4"/>
    
    <!-- Branding Text on Pipe -->
    <text x="240" y="220" transform="rotate(-90 240 220)" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0F172A" opacity="0.75" letter-spacing="2">FORMÜL DIN 8077/8078 CAM ELYAF PN25</text>
    
  </g>
