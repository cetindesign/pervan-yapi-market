<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%">
  <!-- Left: Saint-Gobain Arc Lockup -->
  <g transform="translate(65, 52)">
    <path d="M -50,-10 C -25,-40 25,-40 50,-10 C 40,-3 -40,-3 -50,-10 Z" fill="#0072CE"/>
    <path d="M -42,-10 C -20,-34 20,-34 42,-10 C 33,-4 -33,-4 -42,-10 Z" fill="#00A3E0"/>
    <path d="M -34,-10 C -15,-27 15,-27 34,-10 C 26,-5 -26,-5 -34,-10 Z" fill="#43B02A"/>
    <path d="M -26,-10 C -10,-21 10,-21 26,-10 C 20,-6 -20,-6 -26,-10 Z" fill="#FFB81C"/>
    <path d="M -18,-10 C -6,-15 6,-15 18,-10 C 14,-7 -14,-7 -18,-10 Z" fill="#E05A47"/>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="0.22em" fill="#333333" text-anchor="middle">SAINT-GOBAIN</text>
  </g>

  <!-- Divider Line -->
  <line x1="135" y1="20" x2="135" y2="85" stroke="#DDDDDD" stroke-width="1"/>

  <!-- Right: Weber Hexagon & Wordmark -->
  <g transform="translate(155, 22)">
    <!-- Hexagon emblem (scale 1.0) -->
    <g transform="translate(0, 7)">
      <polygon points="0,28 14,0 42,0 56,28 42,56 14,56" fill="#FEE000"/>
      <polygon points="28,0 42,0 56,28 42,56 28,56 42,28" fill="#111111"/>
      <polygon points="14,28 21,14 35,14 28,28 35,42 21,42" fill="#FFFFFF"/>
    </g>
    <!-- weber wordmark -->
    <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-0.045em" fill="#111111">weber</text>
  </g>
</svg>