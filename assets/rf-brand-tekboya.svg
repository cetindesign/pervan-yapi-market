<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Pure White Canvas with subtle hairline border -->
  <rect width="900" height="1200" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="899" height="1199" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

  <!-- Background Emerald/Teal radiant glow -->
  <defs>
    <radialGradient id="tekGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ECFDF5" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tekGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#tekGlow)"/>

  <!-- Top Badge -->
  <g transform="translate(450, 160)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="0.3em" fill="#475569" text-anchor="middle">SANAYİ VE TİCARET A.Ş.</text>
    <line x1="-120" y1="16" x2="120" y2="16" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Central Visual: Iconic TEK Boya Diamond Seal & Packaging Composition -->
  <g transform="translate(450, 520)">
    <!-- Diamond Frame -->
    <polygon points="0,-210 210,0 0,210 -210,0" fill="none" stroke="url(#tekGrad)" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="0,-175 175,0 0,175 -175,0" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Inner Core Can Shadow -->
    <ellipse cx="0" cy="170" rx="150" ry="32" fill="rgba(0,0,0,0.12)"/>
    
    <!-- Packaging Silhouette -->
    <rect x="-135" y="-100" width="270" height="260" rx="20" fill="#0F766E"/>
    <rect x="-125" y="-88" width="250" height="236" rx="14" fill="#115E59"/>
    <ellipse cx="0" cy="-100" rx="135" ry="28" fill="#99F6E4"/>
    <ellipse cx="0" cy="-104" rx="125" ry="24" fill="#CCFBF1"/>

    <!-- TEK Emblem on Can -->
    <rect x="-95" y="-45" width="190" height="110" rx="10" fill="#047857"/>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="0.05em" fill="#FFFFFF" text-anchor="middle">TEK</text>
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="0.24em" fill="#A7F3D0" text-anchor="middle">BOYA &amp; VERNİK</text>
  </g>

  <!-- Typography at bottom -->
  <text x="450" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-0.02em" fill="#0F766E" text-anchor="middle">TEK Boya</text>
  <text x="450" y="1075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.24em" fill="#64748B" text-anchor="middle">MUKAVİM, ÖZEL YAT VERNİK &amp; ASTAR YETKİLİ BAYİ</text>
</svg>